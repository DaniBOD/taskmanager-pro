<h2>Lista de Tareas</h2>

<div *ngIf="tareas.length === 0">
  No hay tareas registradas.
</div>

<ul>
  <li *ngFor="let tarea of tareas">
    <!-- Vista normal -->
    <div *ngIf="tareaEditando?.id !== tarea.id">
      <strong>{{ tarea.titulo }}</strong> - {{ tarea.descripcion }}<br />
      Estado: {{ tarea.estado }} | Prioridad: {{ tarea.prioridad }}<br />
      Vence: {{ tarea.fechaVencimiento | date }}<br />
      <button (click)="iniciarEdicion(tarea)">Editar</button>
      <button (click)="eliminarTarea(tarea.id)">Eliminar</button>
    </div>

    <!-- Vista de edición -->
    <div *ngIf="tareaEditando?.id === tarea.id">
      <input [(ngModel)]="tareaEditando.titulo" placeholder="Título" />
      <input [(ngModel)]="tareaEditando.descripcion" placeholder="Descripción" />
      <select [(ngModel)]="tareaEditando.prioridad">
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>
      <input type="date" [(ngModel)]="tareaEditando.fechaVencimiento" />
      <br />
      <button (click)="guardarEdicion()">Guardar</button>
      <button (click)="cancelarEdicion()">Cancelar</button>
    </div>
  </li>
</ul>
